name: Publicar na HostGator

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostgator-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar os arquivos do site
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R CRM api dist/
          mkdir -p dist/storage
          cp storage/.htaccess dist/storage/.htaccess
          cp -R painel dist/
          cp -R assets logos scripts styles dist/
          printf "%s\n" "$GITHUB_SHA" > dist/deploy-check.txt

      - name: Diagnosticar raiz FTP
        env:
          FTP_SERVER: ${{ secrets.HOSTGATOR_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTGATOR_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y lftp >/dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" -e '
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set cmd:fail-exit no;
            echo "== initial ==";
            pwd;
            ls;
            echo "== cd .. ==";
            cd ..;
            pwd;
            ls;
            echo "== cd / ==";
            cd /;
            pwd;
            ls;
            echo "== cd /empresarial ==";
            cd /empresarial;
            pwd;
            ls;
            echo "== cd ../empresarial ==";
            cd ../empresarial;
            pwd;
            ls;
            echo "== cd /public_html/empresarial ==";
            cd /public_html/empresarial;
            pwd;
            ls;
            bye;
          '

      - name: Publicar na HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTGATOR_FTP_SERVER }}
          username: ${{ secrets.HOSTGATOR_FTP_USERNAME }}
          password: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /empresarial/
          state-name: .ftp-deploy-sync-state-limabancario-absolute-empresarial.json
